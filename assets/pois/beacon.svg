<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dffb0" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#7dffb0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#halo)"/>
  <!-- pulse rings -->
  <g stroke="#7dffb0" fill="none" stroke-linecap="round">
    <circle cx="256" cy="208" r="64" stroke-width="9" opacity="0.9"/>
    <circle cx="256" cy="208" r="112" stroke-width="8" opacity="0.55"/>
    <circle cx="256" cy="208" r="160" stroke-width="7" opacity="0.3"/>
  </g>
  <!-- mast -->
  <path d="M256 232 L256 350" stroke="#dbe4f5" stroke-width="14" stroke-linecap="round"/>
  <!-- tripod base -->
  <g stroke="#dbe4f5" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M256 350 L192 424"/>
    <path d="M256 350 L320 424"/>
    <path d="M256 350 L256 432"/>
  </g>
  <!-- emitter -->
  <circle cx="256" cy="208" r="26" fill="#7dffb0"/>
  <circle cx="256" cy="208" r="26" fill="none" stroke="#dbe4f5" stroke-width="10"/>
</svg>
